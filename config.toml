# example configuration

# configure release bind
release_bind = ["KeyA", "KeyS", "KeyD", "KeyF"]

# optional port (defaults to 4242)
port = 4242

# list of authorized tls certificate fingerprints that
# are accepted for incoming traffic
[authorized_fingerprints]
"bc:05:ab:7a:a4:de:88:8c:2f:92:ac:bc:b8:49:b8:24:0d:44:b3:e6:a4:ef:d7:0b:6c:69:6d:77:53:0b:14:80" = "iridium"

# define a client on the right side with host name "iridium"
[[clients]]
# position (left | right | top | bottom)
position = "right"
# hostname
hostname = "iridium"
# activate this client immediately when lan-mouse is started
activate_on_startup = true
# optional list of (known) ip addresses
ips = ["192.168.178.156"]

# define a client on the left side with IP address 192.168.178.189
[[clients]]
position = "left"
# The hostname is optional: When no hostname is specified,
# at least one ip address needs to be specified.
hostname = "thorium"
# ips for ethernet and wifi
ips = ["192.168.178.189", "192.168.178.172"]
# optional port
port = 4242
# optional per-client input channel modes.
# mouse_button and keyboard each accept "datagram" (low latency, may drop
# on packet loss) or "stream" (reliable and ordered). Mouse motion always
# uses datagram regardless of this setting.
# Omitting the key keeps the defaults, which are:
# input_channels = { mouse_button = "datagram", keyboard = "stream" }
# For the lowest possible input latency, at the risk of dropped keys:
# input_channels = { mouse_button = "datagram", keyboard = "datagram" }

# === Watchdog self-healing (FIX 4) ============================================
#
# Auto-recovery for "mouse stuck at screen edge" bugs. Three independent
# detections run in the background; any of them can be enabled / disabled /
# threshold-tuned here for diagnostic purposes.
#
# Disable everything globally with env var (highest priority):
#   LAN_MOUSE_WATCHDOG=off ./lan-mouse
#
# Per-check toggles:
#   ghost_active_check    — `State::Sending + active_client=None` (200ms tick)
#   crossing_storm_check  — BeginPending flood without state advance (3s tick)
#   send_failures_check   — consecutive send_input failures in Sending (3s tick)
#   no_progress_check     — state machine frozen for >no_progress_timeout_secs
#
# Tunable thresholds (defaults shown):
#
[watchdog]
enabled = false
# ghost_active_check        = true
# crossing_storm_check      = true
# send_failures_check       = true
# no_progress_check         = true
# light_interval_ms         = 200
# heavy_interval_secs       = 3
# crossing_window_secs      = 5
# crossing_storm_threshold  = 5
# send_failures_threshold   = 3
# no_progress_timeout_secs  = 8
#
# Example: turn off just the send_failures check to test whether it's the
# one responsible for spurious releases:
#
# [watchdog]
# send_failures_check = false
