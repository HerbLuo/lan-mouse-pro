[workspace]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "lan-mouse-ipc",
    "lan-mouse-cli",
    "lan-mouse-proto",
]

[workspace.dependencies]
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
rustls-pemfile = "1.0"

[package]
name = "lan-mouse"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"

[dependencies]
input-event = { path = "input-event", version = "0.4.0" }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
lan-mouse-cli = { path = "lan-mouse-cli", version = "0.3.0" }
lan-mouse-ipc = { path = "lan-mouse-ipc", version = "0.3.0" }
lan-mouse-proto = { path = "lan-mouse-proto", version = "0.4.0" }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"
# M0b STEP-0.2: HTTP/3-lite streaming uses `Bytes` for the body buffer.
bytes = "1"

# Web frontend. axum for HTTP/WS, rust-embed for baking the built Vue
# bundle into the binary, open to launch the user's default browser
# on startup. `hostname` is reused so the General view can show the
# local system hostname.
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["trace"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
open = "5"
hostname = "0.4"
local-ip-address = "0.6"

[dev-dependencies]
rcgen = "0.13"
# rt-multi-thread: required by `local_set_test!` which runs under the multi_thread flavor
tokio = { version = "1.32.0", features = ["rt-multi-thread", "time", "macros"] }
# h3 spike (M0b STEP-0.2 Path 1) — see `examples/h3_pingpong.rs`.
h3 = "0.0.8"
h3-quinn = "0.0.10"
rand = "0.8"
# M3a STEP-3a.1 — file_meta unit tests use tempdir() to materialise
# 1 KiB / 1 MiB / 200 MiB fixtures. Already pulled in transitively by
# `h3`; declared explicitly so the dev-deps graph stays self-describing.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

# M1a STEP-1a.3 — Windows clipboard backend (`OpenClipboard` /
# `GetClipboardData` / `SetClipboardData` via `windows-sys`). Only
# pulled in when compiling for `target_os = "windows"`.
# M2b STEP-2b.1 — added `Win32_Graphics_Gdi` (BITMAPV5HEADER /
# BITMAPINFOHEADER structs used by CF_DIBV5 payload encoding) and
# `Win32_System_Ole` (CF_DIB / CF_DIBV5 clipboard format constants).
# Also added `image` (PNG decode + BMP encode for the PNG→DIB write
# path on Windows; same crate is reused by the macOS backend but
# with a tighter macOS-only feature list below).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_Shell"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

# M2b STEP-2b.2 — Linux clipboard image backend (xclip /
# wl-paste / wl-copy). Only pulled in when compiling for
# `target_os = "linux"`. Features: PNG (write + read for round-trip
# tests) + BMP (decode for the DIB → PNG fallback used by
# `set_dib_image`). No TIFF / JPEG support — the dispatcher
# normalises inbound to PNG before reaching this backend (PLAN §3
# M2a STEP-2a.2 "源端强制 PNG 归一化"), and the Linux toolchain
# (xclip / wl-paste) only natively speaks `image/png`.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

# M2a STEP-2a.2 — macOS clipboard image backend (`NSPasteboard` via
# `objc2` + `image` crate for TIFF→PNG normalization, PLAN §3 评审
# #2 3rd). Only pulled in when compiling for `target_os = "macos"`.
# Text path stays on `pbcopy` / `pbpaste` (M1a 1a.2 — no objc2 dep).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# `image` features: PNG (write) + TIFF (read fallback) + BMP (read
# for DIB fallback in `dib_to_png_via_image_crate`, M2b STEP-2b.1).
# Default features include many formats we don't need; explicit
# feature list keeps the dep tree minimal. See
# `src/clipboard/macos.rs::tiff_to_png_normalized` and
# `src/clipboard/macos.rs::dib_to_png_via_image_crate`.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }

[features]
default = [
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]

[package.metadata.bundle]
name = "Lan Mouse"
icon = ["target/icon.icns", "resources/de.feschber.LanMouse.svg"]
identifier = "de.feschber.LanMouse"
osx_info_plist = "build-aux/macos-lsui-element.plist"
osx_resources = "target/menubar-template.png"